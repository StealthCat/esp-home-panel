# Shared hardware definition for Waveshare ESP32-S3-Touch-LCD-7C-BOX.
# Pins/timings follow Waveshare's 7C reference source, not the older 7-inch board.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  platformio_options:
    board_build.flash_mode: qio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  - id: panel_i2c
    sda: GPIO47
    scl: GPIO48
    frequency: 400kHz
    scan: true

waveshare_io_ch32v003:
  - id: panel_io
    address: 0x24
    i2c_id: panel_i2c

output:
  - platform: gpio
    id: panel_backlight_output
    pin:
      waveshare_io_ch32v003: panel_io
      number: 2
      mode: OUTPUT

light:
  - platform: binary
    id: panel_backlight
    name: "Display Backlight"
    output: panel_backlight_output
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_rgb
    model: RPI
    id: panel_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 16MHz
    pclk_inverted: true
    dimensions:
      width: 800
      height: 480
    reset_pin:
      waveshare_io_ch32v003: panel_io
      number: 0
      mode: OUTPUT
    enable_pin:
      waveshare_io_ch32v003: panel_io
      number: 5
      mode: OUTPUT
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    hsync_pulse_width: 4
    hsync_back_porch: 8
    hsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    data_pins:
      red: [GPIO1, GPIO2, GPIO42, GPIO41, GPIO40]
      green: [GPIO39, GPIO0, GPIO45, GPIO9, GPIO8, GPIO21]
      blue: [GPIO14, GPIO38, GPIO18, GPIO17, GPIO10]

touchscreen:
  - platform: gt911
    id: panel_touch
    i2c_id: panel_i2c
    interrupt_pin: GPIO4
    display: panel_display
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - light.turn_on: panel_backlight
            - lvgl.resume:
            - lvgl.widget.redraw:

font:
  - file: "gfonts://Inter"
    id: ui_small
    size: 13
    bpp: 4
  - file: "gfonts://Inter"
    id: ui_body
    size: 16
    bpp: 4
  - file:
      type: gfonts
      family: Inter
      weight: 600
    id: ui_heading
    size: 20
    bpp: 4
  - file:
      type: gfonts
      family: Inter
      weight: 700
    id: ui_title
    size: 28
    bpp: 4

time:
  - platform: homeassistant
    id: panel_time
