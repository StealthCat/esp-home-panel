                  text: "100%"
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${overhead_light_entity}
                          brightness_pct: 100
        - obj:
            x: 18
            y: 274
            width: 374
            height: 188
            radius: 18
            bg_color: ${card_bg}
            bg_opa: COVER
            border_color: ${border_color}
            border_width: 1
            pad_all: 0
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "CEILING FAN"
                  text_font: ui_heading
              - label:
                  id: fan_status_label
                  x: 302
                  y: 16
                  width: 52
                  text_align: RIGHT
                  text: "..."
                  text_font: ui_small
                  text_color: ${status_color}
              - image:
                  x: 28
                  y: 55
                  src: theme_fan_art
              - label:
                  x: 145
                  y: 65
                  text: "SMART SWITCH"
                  text_font: ui_small
                  text_color: ${muted_color}
              - button:
                  x: 145
                  y: 94
                  width: 195
                  height: 60
                  text: "FAN ON / OFF"
                  on_short_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: ${ceiling_fan_entity}
        - obj:
            x: 408
            y: 274
            width: 374
            height: 188
            radius: 18
            bg_color: ${card_bg}
            bg_opa: COVER
            border_color: ${border_color}
            border_width: 1
            pad_all: 0
