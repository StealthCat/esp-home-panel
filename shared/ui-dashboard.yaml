# Full-screen mockup artwork with transparent LVGL interaction regions.
# The visible dashboard is supplied by each theme's assets/screen.svg.
# Controls below line up with the controls drawn into that artwork.

lvgl:
  displays:
    - panel_display
  touchscreens:
    - touchscreen_id: panel_touch
  buffer_size: 25%
  bg_color: 0x000000

  theme:
    button:
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      pressed:
        bg_opa: TRANSP
    slider:
      bg_opa: TRANSP
      border_width: 0
      indicator:
        bg_opa: TRANSP
      knob:
        bg_opa: TRANSP
        border_width: 0
        shadow_width: 0

  on_idle:
    - timeout: 10min
      then:
        - light.turn_off: panel_backlight
        - lvgl.pause:

  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # Pixel-aligned visual surface. All bevels, artwork, card textures,
        # icons and decorative graphics live in this 800x480 image.
        - image:
            x: 0
            y: 0
            src: theme_screen

        # ------------------------------------------------------------------
        # Tapo LED strip
        # ------------------------------------------------------------------
        - button:
            x: 292
            y: 76
            width: 96
            height: 64
            on_short_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: ${tapo_led_entity}

        - button:
            x: 166
            y: 145
            width: 43
            height: 48
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    color_name: red
        - button:
            x: 205
            y: 145
            width: 43
            height: 48
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    color_name: orange
        - button:
            x: 244
            y: 145
            width: 43
            height: 48
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    color_name: yellow
        - button:
            x: 283
            y: 145
            width: 43
            height: 48
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    color_name: green
        - button:
            x: 322
            y: 145
            width: 43
            height: 48
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    color_name: blue
        - button:
            x: 361
            y: 145
            width: 39
            height: 48
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    color_name: purple

        - slider:
            id: tapo_brightness_slider
            x: 190
            y: 216
            width: 180
            height: 49
            min_value: 0
            max_value: 255
            value: 180
            adv_hittest: true
            on_release:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${tapo_led_entity}
                    brightness: !lambda 'return (int) x;'

        # ------------------------------------------------------------------
        # Overhead light
        # ------------------------------------------------------------------
        - button:
            x: 690
            y: 76
            width: 92
            height: 64
            on_short_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: ${overhead_light_entity}

        - slider:
            id: overhead_brightness_slider
            x: 463
            y: 181
            width: 292
            height: 48
            min_value: 0
            max_value: 255
            value: 160
            adv_hittest: true
            on_release:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${overhead_light_entity}
                    brightness: !lambda 'return (int) x;'

        - button:
            x: 422
            y: 216
            width: 88
            height: 52
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${overhead_light_entity}
                    brightness_pct: 25
        - button:
            x: 510
            y: 216
            width: 88
            height: 52
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${overhead_light_entity}
                    brightness_pct: 50
        - button:
            x: 598
            y: 216
            width: 88
            height: 52
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${overhead_light_entity}
                    brightness_pct: 75
        - button:
            x: 686
            y: 216
            width: 94
            height: 52
            on_short_click:
              - homeassistant.action:
                  action: light.turn_on
                  data:
                    entity_id: ${overhead_light_entity}
                    brightness_pct: 100

        # ------------------------------------------------------------------
        # Ceiling fan smart switch. The fan emblem and toggle are both active.
        # ------------------------------------------------------------------
        - button:
            x: 24
            y: 320
            width: 130
            height: 137
            on_short_click:
              - homeassistant.action:
                  action: switch.toggle
                  data:
                    entity_id: ${ceiling_fan_entity}
        - button:
            x: 222
            y: 328
            width: 116
            height: 76
            on_short_click:
              - homeassistant.action:
                  action: switch.toggle
                  data:
                    entity_id: ${ceiling_fan_entity}

        # ------------------------------------------------------------------
        # Echo Dot
        # ------------------------------------------------------------------
        - slider:
            id: echo_volume_slider
            x: 463
            y: 363
            width: 292
            height: 50
            min_value: 0
            max_value: 100
            value: 50
            adv_hittest: true
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  data:
                    entity_id: ${echo_dot_entity}
                    volume_level: !lambda 'return x / 100.0f;'

        - button:
            x: 420
            y: 404
            width: 112
            height: 70
            on_short_click:
              - homeassistant.action:
                  action: media_player.volume_mute
                  data:
                    entity_id: ${echo_dot_entity}
                    is_volume_muted: !lambda 'return !id(echo_muted).state;'
        - button:
            x: 526
            y: 404
            width: 116
            height: 70
            on_short_click:
              - homeassistant.action:
                  action: media_player.media_play_pause
                  data:
                    entity_id: ${echo_dot_entity}
        - button:
            x: 638
            y: 404
            width: 156
            height: 70
            on_short_click:
              - homeassistant.event:
                  event: esphome.panel_echo_announce
                  data:
                    entity_id: ${echo_dot_entity}
                    panel: ${name}
