              - label:
                  x: 92
                  y: 62
                  text: "VOLUME"
                  text_font: ui_small
                  text_color: ${muted_color}
              - slider:
                  id: echo_volume_slider
                  x: 92
                  y: 88
                  width: 248
                  height: 18
                  min_value: 0
                  max_value: 100
                  value: 50
                  adv_hittest: true
                  on_release:
                    - homeassistant.action:
                        action: media_player.volume_set
                        data:
                          entity_id: ${echo_dot_entity}
                          volume_level: !lambda 'return x / 100.0f;'
              - button:
                  x: 20
                  y: 127
                  width: 100
                  height: 42
                  widgets:
                    - label:
                        id: echo_mute_label
                        align: CENTER
                        text: "MUTE"
                        text_font: ui_small
                  on_short_click:
                    - homeassistant.action:
                        action: media_player.volume_mute
                        data:
                          entity_id: ${echo_dot_entity}
                          is_volume_muted: !lambda 'return !id(echo_muted).state;'
              - button:
                  x: 132
                  y: 127
                  width: 102
                  height: 42
                  text: "PLAY/PAUSE"
                  on_short_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data:
                          entity_id: ${echo_dot_entity}
              - button:
                  x: 246
                  y: 127
                  width: 108
                  height: 42
                  text: "ANNOUNCE"
                  on_short_click:
                    - homeassistant.event:
                        event: esphome.panel_echo_announce
                        data:
                          entity_id: ${echo_dot_entity}
                          panel: ${name}
