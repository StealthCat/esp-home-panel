                  height: 42
                  text: "POWER"
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${overhead_light_entity}
              - label:
                  x: 24
                  y: 60
                  text: "BRIGHTNESS"
                  text_font: ui_small
                  text_color: ${muted_color}
              - slider:
                  id: overhead_brightness_slider
                  x: 24
                  y: 89
                  width: 329
                  height: 20
                  min_value: 0
                  max_value: 255
                  value: 160
                  adv_hittest: true
                  on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${overhead_light_entity}
