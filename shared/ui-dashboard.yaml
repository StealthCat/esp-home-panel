# 800x480 LVGL dashboard. Entity IDs and colors are supplied by panel.yaml substitutions.

lvgl:
  displays:
    - panel_display
  touchscreens:
    - touchscreen_id: panel_touch
  buffer_size: 25%
  default_font: ui_body
  bg_color: ${screen_bg}
  text_color: ${text_color}
  theme:
    button:
      bg_color: ${button_bg}
      bg_opa: COVER
      border_color: ${border_color}
      border_width: 1
      radius: 12
      text_color: ${text_color}
      pressed:
        bg_color: ${accent_color}
    slider:
      bg_color: ${slider_bg}
      bg_opa: COVER
      radius: 8
      indicator:
        bg_color: ${accent_color}
        bg_opa: COVER
        radius: 8
      knob:
        bg_color: 0xFFFFFF
        bg_opa: COVER
        radius: 12
        pad_all: 3
  gradients:
    - id: color_wheel_gradient
      direction: conical
      stops:
        - color: 0xFF0000
          position: 0
        - color: 0xFFFF00
          position: 42
        - color: 0x00FF00
          position: 84
        - color: 0x00FFFF
          position: 127
        - color: 0x0000FF
          position: 169
        - color: 0xFF00FF
          position: 212
        - color: 0xFF0000
          position: 255
  on_idle:
    - timeout: 10min
      then:
        - light.turn_off: panel_backlight
        - lvgl.pause:
  pages:
    - id: main_page
      bg_color: ${screen_bg}
      bg_opa: COVER
      widgets:
        - label:
            x: 24
            y: 12
            text: "HOME CONTROL"
            text_font: ui_title
            text_color: ${text_color}
        - label:
            x: 26
            y: 46
            text: "${tagline}"
            text_font: ui_small
            text_color: ${muted_color}
        - image:
            x: 500
            y: 8
            src: theme_header_art
        - label:
            id: clock_label
            x: 704
            y: 11
            width: 72
            text_align: RIGHT
            text: "--:--"
            text_font: ui_heading
            text_color: ${text_color}
        - label:
            id: date_label
            x: 674
            y: 40
            width: 102
            text_align: RIGHT
            text: "--- --"
            text_font: ui_small
            text_color: ${muted_color}
        - obj:
            x: 18
            y: 76
            width: 374
            height: 184
            radius: 18
            bg_color: ${card_bg}
            bg_opa: COVER
            border_color: ${border_color}
            border_width: 1
            pad_all: 0
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "TAPO LED STRIP"
                  text_font: ui_heading
              - label:
                  id: tapo_status_label
                  x: 302
                  y: 16
                  width: 52
                  text_align: RIGHT
                  text: "..."
                  text_font: ui_small
                  text_color: ${status_color}
              - obj:
                  x: 18
                  y: 50
                  width: 82
                  height: 82
                  radius: 41
                  border_width: 0
                  pad_all: 0
                  bg_grad: color_wheel_gradient
              - label:
                  x: 20
                  y: 139
                  width: 80
                  text_align: CENTER
                  text: "COLOR"
                  text_font: ui_small
                  text_color: ${muted_color}
              - button:
                  x: 120
                  y: 54
                  width: 32
                  height: 32
                  radius: 16
                  bg_color: 0xFF3B30
                  border_width: 0
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          color_name: red
              - button:
                  x: 159
                  y: 54
                  width: 32
                  height: 32
                  radius: 16
                  bg_color: 0xFF9500
                  border_width: 0
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          color_name: orange
              - button:
                  x: 198
                  y: 54
                  width: 32
                  height: 32
                  radius: 16
                  bg_color: 0xFFD60A
                  border_width: 0
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          color_name: yellow
              - button:
                  x: 237
                  y: 54
                  width: 32
                  height: 32
                  radius: 16
                  bg_color: 0x30D158
                  border_width: 0
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          color_name: green
              - button:
                  x: 276
                  y: 54
                  width: 32
                  height: 32
                  radius: 16
                  bg_color: 0x0A84FF
                  border_width: 0
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          color_name: blue
              - button:
                  x: 315
                  y: 54
                  width: 32
                  height: 32
                  radius: 16
                  bg_color: 0xBF5AF2
                  border_width: 0
                  on_short_click:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          color_name: purple
              - label:
                  x: 120
                  y: 98
                  text: "BRIGHTNESS"
                  text_font: ui_small
                  text_color: ${muted_color}
              - slider:
                  id: tapo_brightness_slider
                  x: 120
                  y: 122
                  width: 155
                  height: 18
                  min_value: 0
                  max_value: 255
                  value: 180
                  adv_hittest: true
                  on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${tapo_led_entity}
                          brightness: !lambda 'return (int) x;'
              - button:
                  x: 286
                  y: 111
                  width: 67
                  height: 42
                  text: "POWER"
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${tapo_led_entity}
        - obj:
            x: 408
            y: 76
            width: 374
            height: 184
            radius: 18
            bg_color: ${card_bg}
            bg_opa: COVER
            border_color: ${border_color}
            border_width: 1
            pad_all: 0
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "OVERHEAD LIGHT"
