# Shared Home Assistant bridge for the artwork-first dashboards.
# The visible status text, icons and chrome are part of the full-screen theme
# artwork. Only state needed by interactive controls is mirrored into LVGL.

binary_sensor:
  - platform: homeassistant
    id: echo_muted
    entity_id: ${echo_dot_entity}
    attribute: is_volume_muted

sensor:
  - platform: homeassistant
    id: tapo_brightness_state
    entity_id: ${tapo_led_entity}
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: tapo_brightness_slider
            value: !lambda |-
              if (isnan(x)) return 0;
              return (int) x;

  - platform: homeassistant
    id: overhead_brightness_state
    entity_id: ${overhead_light_entity}
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: overhead_brightness_slider
            value: !lambda |-
              if (isnan(x)) return 0;
              return (int) x;

  - platform: homeassistant
    id: echo_volume_state
    entity_id: ${echo_dot_entity}
    attribute: volume_level
    on_value:
      then:
        - lvgl.slider.update:
            id: echo_volume_slider
            value: !lambda |-
              if (isnan(x)) return 0;
              return (int) roundf(x * 100.0f);
