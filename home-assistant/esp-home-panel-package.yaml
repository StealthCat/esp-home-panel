# Home Assistant package for the ESP-IDF Waveshare 7C BOX panel.
#
# Edit the four entity IDs if yours are different, then place this file in a
# directory enabled by homeassistant.packages or split the automations into
# your normal automations.yaml.
#
# The panel talks to Home Assistant through the same MQTT broker used by HA.

automation:
  - id: esp_home_panel_tapo_command
    alias: "7C Panel - Tapo LED commands"
    mode: queued
    trigger:
      - platform: mqtt
        topic: "home/7c-panel/cmd/tapo"
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.on is defined }}"
        then:
          - if:
              - condition: template
                value_template: "{{ trigger.payload_json.on | bool }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: light.tapo_led_strip
            else:
              - service: light.turn_off
                target:
                  entity_id: light.tapo_led_strip

      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.brightness is defined }}"
        then:
          - service: light.turn_on
            target:
              entity_id: light.tapo_led_strip
            data:
              brightness_pct: "{{ trigger.payload_json.brightness | int }}"

      - if:
          - condition: template
            value_template: >-
              {{ trigger.payload_json.r is defined
                 and trigger.payload_json.g is defined
                 and trigger.payload_json.b is defined }}
        then:
          - service: light.turn_on
            target:
              entity_id: light.tapo_led_strip
            data:
              rgb_color:
                - "{{ trigger.payload_json.r | int }}"
                - "{{ trigger.payload_json.g | int }}"
                - "{{ trigger.payload_json.b | int }}"

  - id: esp_home_panel_overhead_command
    alias: "7C Panel - Overhead light commands"
    mode: queued
    trigger:
      - platform: mqtt
        topic: "home/7c-panel/cmd/overhead"
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.on is defined }}"
        then:
          - if:
              - condition: template
                value_template: "{{ trigger.payload_json.on | bool }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: light.overhead_light
            else:
              - service: light.turn_off
                target:
                  entity_id: light.overhead_light

      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.brightness is defined }}"
        then:
          - service: light.turn_on
            target:
              entity_id: light.overhead_light
            data:
              brightness_pct: "{{ trigger.payload_json.brightness | int }}"

  - id: esp_home_panel_fan_command
    alias: "7C Panel - Ceiling fan switch commands"
    mode: queued
    trigger:
      - platform: mqtt
        topic: "home/7c-panel/cmd/fan"
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.on | bool }}"
        then:
          - service: switch.turn_on
            target:
              entity_id: switch.ceiling_fan
        else:
          - service: switch.turn_off
            target:
              entity_id: switch.ceiling_fan

  - id: esp_home_panel_echo_command
    alias: "7C Panel - Echo Dot commands"
    mode: queued
    trigger:
      - platform: mqtt
        topic: "home/7c-panel/cmd/echo"
    action:
      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.volume is defined }}"
        then:
          - service: media_player.volume_set
            target:
              entity_id: media_player.echo_dot
            data:
              volume_level: "{{ (trigger.payload_json.volume | float) / 100.0 }}"

      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.muted is defined }}"
        then:
          - service: media_player.volume_mute
            target:
              entity_id: media_player.echo_dot
            data:
              is_volume_muted: "{{ trigger.payload_json.muted | bool }}"

      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'play_pause' }}"
        then:
          - service: media_player.media_play_pause
            target:
              entity_id: media_player.echo_dot

      - if:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'announce' }}"
        then:
          - event: esp_home_panel_announce
            event_data:
              entity_id: media_player.echo_dot

  - id: esp_home_panel_tapo_state
    alias: "7C Panel - Publish Tapo LED state"
    mode: restart
    trigger:
      - platform: state
        entity_id: light.tapo_led_strip
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/tapo"
          qos: 1
          retain: true
          payload: >-
            {% set rgb = state_attr('light.tapo_led_strip', 'rgb_color') or [255, 255, 255] %}
            {{ {
              'on': is_state('light.tapo_led_strip', 'on'),
              'brightness': (((state_attr('light.tapo_led_strip', 'brightness') | int(0)) * 100 / 255) | round | int),
              'r': rgb[0] | int,
              'g': rgb[1] | int,
              'b': rgb[2] | int
            } | to_json }}

  - id: esp_home_panel_overhead_state
    alias: "7C Panel - Publish overhead light state"
    mode: restart
    trigger:
      - platform: state
        entity_id: light.overhead_light
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/overhead"
          qos: 1
          retain: true
          payload: >-
            {{ {
              'on': is_state('light.overhead_light', 'on'),
              'brightness': (((state_attr('light.overhead_light', 'brightness') | int(0)) * 100 / 255) | round | int)
            } | to_json }}

  - id: esp_home_panel_fan_state
    alias: "7C Panel - Publish fan switch state"
    mode: restart
    trigger:
      - platform: state
        entity_id: switch.ceiling_fan
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/fan"
          qos: 1
          retain: true
          payload: >-
            {{ {'on': is_state('switch.ceiling_fan', 'on')} | to_json }}

  - id: esp_home_panel_echo_state
    alias: "7C Panel - Publish Echo Dot state"
    mode: restart
    trigger:
      - platform: state
        entity_id: media_player.echo_dot
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/echo"
          qos: 1
          retain: true
          payload: >-
            {{ {
              'volume': ((state_attr('media_player.echo_dot', 'volume_level') | float(0)) * 100) | round | int,
              'muted': state_attr('media_player.echo_dot', 'is_volume_muted') | bool(false),
              'playing': is_state('media_player.echo_dot', 'playing')
            } | to_json }}

  - id: esp_home_panel_state_request
    alias: "7C Panel - Publish complete state on request"
    mode: restart
    trigger:
      - platform: mqtt
        topic: "home/7c-panel/request_state"
    action:
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/tapo"
          qos: 1
          retain: true
          payload: >-
            {% set rgb = state_attr('light.tapo_led_strip', 'rgb_color') or [255, 255, 255] %}
            {{ {
              'on': is_state('light.tapo_led_strip', 'on'),
              'brightness': (((state_attr('light.tapo_led_strip', 'brightness') | int(0)) * 100 / 255) | round | int),
              'r': rgb[0] | int,
              'g': rgb[1] | int,
              'b': rgb[2] | int
            } | to_json }}
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/overhead"
          qos: 1
          retain: true
          payload: >-
            {{ {
              'on': is_state('light.overhead_light', 'on'),
              'brightness': (((state_attr('light.overhead_light', 'brightness') | int(0)) * 100 / 255) | round | int)
            } | to_json }}
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/fan"
          qos: 1
          retain: true
          payload: >-
            {{ {'on': is_state('switch.ceiling_fan', 'on')} | to_json }}
      - service: mqtt.publish
        data:
          topic: "home/7c-panel/state/echo"
          qos: 1
          retain: true
          payload: >-
            {{ {
              'volume': ((state_attr('media_player.echo_dot', 'volume_level') | float(0)) * 100) | round | int,
              'muted': state_attr('media_player.echo_dot', 'is_volume_muted') | bool(false),
              'playing': is_state('media_player.echo_dot', 'playing')
            } | to_json }}
