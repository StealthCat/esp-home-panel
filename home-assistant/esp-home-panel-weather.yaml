# Install alongside esp-home-panel-mqtt-bridge.yaml as a Home Assistant package.
# If you changed the panel MQTT base topic, change the trigger prefix below.
# Entity choices are configured in each panel's web settings. This package
# reads station sensors only; it never sends actions to the weather station.
automation:
  - id: esp_home_panel_weather
    alias: ESP Home Panel - station readings and daily forecast
    mode: parallel
    max: 16
    triggers:
      - trigger: mqtt
        topic: "home/7c-panel/+/request_weather"
    actions:
      - variables:
          base: "{{ trigger.topic.rsplit('/request_weather', 1)[0] }}"
          station: "{{ trigger.payload_json.station | default('', true) }}"
          forecast: "{{ trigger.payload_json.forecast | default('', true) }}"
          refresh_forecast: "{{ trigger.payload_json.refresh_forecast | default(false) }}"
          station_device: "{{ device_id(station) if station.startswith('sensor.') else none }}"
          station_entities: >-
            {% set other = device_entities(station_device) | select('match', '^sensor\\.') | list if station_device else [] %}
            {{ ([station] + (other | reject('equalto', station) | sort | list)) if station.startswith('sensor.') else [] }}
      - action: mqtt.publish
        data:
          topic: "{{ base }}/state/weather"
          qos: 1
          retain: false
          payload: >-
            {% set ns = namespace(fields=[]) %}
            {% for entity in station_entities[:48] %}
              {% set value = states(entity) %}
              {% set unit = state_attr(entity, 'unit_of_measurement') or '' %}
              {% set ns.fields = ns.fields + [{
                'label': (state_attr(entity, 'friendly_name') or entity)[-70:],
                'value': (value if value not in ['unknown', 'unavailable'] else 'Unavailable')[:32],
                'unit': unit[:16] if value not in ['unknown', 'unavailable'] else ''
              }] %}
            {% endfor %}
            {% set selected = expand(station) | list if station.startswith('sensor.') else [] %}
            {% set age = (as_timestamp(now()) - as_timestamp(selected[0].last_reported, 0)) | int if selected else 86400 %}
            {{ {'version': 1,
                'available': has_value(station) if station.startswith('sensor.') else false,
                'name': ((device_attr(station_device, 'name_by_user') or device_attr(station_device, 'name') or 'Weather station') if station_device else 'Weather station')[:70],
                'age_seconds': [86400, [0, age] | max] | min,
                'truncated': station_entities | count > 48,
                'fields': ns.fields} | to_json }}
      - if: "{{ refresh_forecast }}"
        then:
          - variables:
              daily: {}
          - if: "{{ forecast.startswith('weather.') and has_value(forecast) }}"
            then:
              - action: weather.get_forecasts
                continue_on_error: true
                target:
                  entity_id: "{{ forecast }}"
                data:
                  type: daily
                response_variable: daily
          - action: mqtt.publish
            data:
              topic: "{{ base }}/state/forecast"
              qos: 1
              retain: false
              payload: >-
                {% set rows = (daily | default({})).get(forecast, {}).get('forecast', []) %}
                {% set unit = state_attr(forecast, 'temperature_unit') or '' %}
                {% set rain_unit = state_attr(forecast, 'precipitation_unit') or '' %}
                {% set ns = namespace(days=[]) %}
                {% for row in rows %}
                  {% set dt = as_datetime(row.get('datetime'), none) %}
                  {% if dt and as_local(dt).date() >= now().date() and ns.days | count < 5 %}
                    {% set rain = (row.precipitation_probability | string ~ '% rain') if row.get('precipitation_probability') is not none else ((row.precipitation | string ~ ' ' ~ rain_unit) if row.get('precipitation') is not none else '--') %}
                    {% set ns.days = ns.days + [{
                      'date': as_local(dt).strftime('%a %m/%d'),
                      'condition': (row.get('condition') or 'unknown')[:32],
                      'high': (row.temperature | string ~ ' ' ~ unit) if row.get('temperature') is not none else '--',
                      'low': (row.templow | string ~ ' ' ~ unit) if row.get('templow') is not none else '--',
                      'rain': rain[:32]}] %}
                  {% endif %}
                {% endfor %}
                {{ {'version': 1, 'available': ns.days | count > 0, 'days': ns.days} | to_json }}
