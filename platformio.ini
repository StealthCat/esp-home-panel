[platformio]
default_envs = waveshare-7c-box
src_dir = main

[env:waveshare-7c-box]
platform = espressif32 @ 6.13.0
framework = espidf
platform_packages =
    platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
board = waveshare-7c-box
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

extra_scripts =
    pre:tools/prepare_sdkconfig.py

[env:wokwi]
extends = env:waveshare-7c-box
build_flags =
    -DWOKWI_EMULATOR=1
extra_scripts =
    pre:tools/prepare_sdkconfig.py
    pre:tools/generate_artwork.py
    post:tools/wokwi_merge.py

; Same application and LVGL UI; only the physical LCD/touch transport is
; replaced by the Wokwi virtual 800x480 panel.
