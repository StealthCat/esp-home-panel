[platformio]
default_envs = waveshare-7c-box
src_dir = main

[env:waveshare-7c-box]
platform = espressif32 @ 6.13.0
framework = espidf
board = waveshare-7c-box
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Regenerate main/artwork.c from the canonical SVG assets before every build.
extra_scripts = pre:tools/generate_artwork.py

[env:wokwi]
extends = env:waveshare-7c-box
build_flags =
    -DWOKWI_EMULATOR=1

; Same application and LVGL UI; only the physical LCD/touch transport is
; replaced by the Wokwi virtual 800x480 panel.
