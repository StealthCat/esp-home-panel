[platformio]
default_envs = waveshare-7c-box

[env:waveshare-7c-box]
platform = espressif32 @ 6.13.0
framework = espidf
board = waveshare-7c-box
monitor_speed = 115200

; Keep PlatformIO on the same ESP-IDF generation as the native build.
; Espressif32 6.13.0 packages ESP-IDF 5.5.3.
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; The 7C BOX uses 32 MB flash and octal PSRAM. Flash/PSRAM mode is
; configured by sdkconfig.defaults; the custom board manifest fixes
; PlatformIO's upload/size assumptions.
upload_speed = 460800

; PlatformIO will use the existing ESP-IDF CMake project rooted here.
; Managed components in main/idf_component.yml are resolved by IDF's
; component manager during the configure/build step.
