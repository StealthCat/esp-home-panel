substitutions:
  name: "home-panel-classic"
  friendly_name: "Home Panel Classic"

  # Replace these four placeholders with the entity IDs from your Home Assistant instance.
  tapo_led_entity: "light.tapo_led_strip"
  overhead_light_entity: "light.overhead_light"
  ceiling_fan_entity: "switch.ceiling_fan"
  echo_dot_entity: "media_player.echo_dot"

  # Theme tokens retained for compatibility with shared packages/customization.
  tagline: "Smart Home  •  ESPHome + Home Assistant"
  screen_bg: "0x0B1118"
  card_bg: "0x131E29"
  button_bg: "0x1C2A38"
  slider_bg: "0x344455"
  border_color: "0x31485E"
  accent_color: "0x269BFF"
  text_color: "0xF5F9FF"
  muted_color: "0x9FB3C8"
  status_color: "0x35D47A"

packages:
  hardware: !include ../../shared/waveshare-7c-hardware.yaml
  controls: !include ../../shared/home-assistant-controls.yaml
  interface: !include ../../shared/ui-dashboard.yaml

# The complete 800x480 visible surface is a single artwork asset. ESPHome
# rasterizes the SVG to RGB565 at compile time; LVGL places transparent touch
# targets over the controls in shared/ui-dashboard.yaml.
image:
  - platform: file
    file: "assets/screen.svg"
    id: theme_screen
    type: RGB565
    resize: 800x480
