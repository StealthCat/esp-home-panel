substitutions:
  name: "home-panel-magic"
  friendly_name: "Home Panel Magic"
  tapo_led_entity: "light.tapo_led_strip"
  overhead_light_entity: "light.overhead_light"
  ceiling_fan_entity: "switch.ceiling_fan"
  echo_dot_entity: "media_player.echo_dot"
  tagline: "Build  •  Explore  •  A little everyday magic"
  screen_bg: "0x061329"
  card_bg: "0x0B2042"
  button_bg: "0x132D55"
  slider_bg: "0x294567"
  border_color: "0x2D5F99"
  accent_color: "0x2CA7FF"
  text_color: "0xF6FAFF"
  muted_color: "0xABC7E7"
  status_color: "0x5AF29A"

packages:
  hardware: !include ../../shared/waveshare-7c-hardware.yaml
  controls: !include ../../shared/home-assistant-controls.yaml
  interface: !include ../../shared/ui-dashboard.yaml

image:
  - platform: file
    file: "assets/header-art.svg"
    id: theme_header_art
    type: RGB565
    transparency: alpha_channel
    resize: 160x54
  - platform: file
    file: "assets/fan.svg"
    id: theme_fan_art
    type: RGB565
    transparency: alpha_channel
    resize: 96x96
  - platform: file
    file: "assets/echo.svg"
    id: theme_echo_art
    type: RGB565
    transparency: alpha_channel
    resize: 54x54
