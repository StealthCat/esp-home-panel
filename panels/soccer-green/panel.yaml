substitutions:
  name: "home-panel-soccer"
  friendly_name: "Home Panel Soccer"
  tapo_led_entity: "light.tapo_led_strip"
  overhead_light_entity: "light.overhead_light"
  ceiling_fan_entity: "switch.ceiling_fan"
  echo_dot_entity: "media_player.echo_dot"
  tagline: "Home Field  •  Fast local control"
  screen_bg: "0x061A11"
  card_bg: "0x0B2A1B"
  button_bg: "0x123D28"
  slider_bg: "0x294B39"
  border_color: "0x217545"
  accent_color: "0x35E66B"
  text_color: "0xF2FFF6"
  muted_color: "0x9BC8AB"
  status_color: "0x61F58B"

packages:
  hardware: !include ../../shared/waveshare-7c-hardware.yaml
  controls: !include ../../shared/home-assistant-controls.yaml
  interface: !include ../../shared/ui-dashboard.yaml

image:
  - platform: file
    file: "assets/header-art.svg"
    id: theme_header_art
    type: RGB565
    transparency: alpha_channel
    resize: 160x54
  - platform: file
    file: "assets/fan.svg"
    id: theme_fan_art
    type: RGB565
    transparency: alpha_channel
    resize: 96x96
  - platform: file
    file: "assets/echo.svg"
    id: theme_echo_art
    type: RGB565
    transparency: alpha_channel
    resize: 54x54
