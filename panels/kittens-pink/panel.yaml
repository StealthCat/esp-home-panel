substitutions:
  name: "home-panel-kittens"
  friendly_name: "Home Panel Kittens"
  tapo_led_entity: "light.tapo_led_strip"
  overhead_light_entity: "light.overhead_light"
  ceiling_fan_entity: "switch.ceiling_fan"
  echo_dot_entity: "media_player.echo_dot"
  tagline: "Cozy controls  •  Purrfectly connected"
  screen_bg: "0x24151D"
  card_bg: "0x38222D"
  button_bg: "0x4C2A39"
  slider_bg: "0x674252"
  border_color: "0x8F506A"
  accent_color: "0xFF6FAE"
  text_color: "0xFFF5FA"
  muted_color: "0xE7B6CB"
  status_color: "0x6FF59D"

packages:
  hardware: !include ../../shared/waveshare-7c-hardware.yaml
  controls: !include ../../shared/home-assistant-controls.yaml
  interface: !include ../../shared/ui-dashboard.yaml

image:
  - platform: file
    file: "assets/header-art.svg"
    id: theme_header_art
    type: RGB565
    transparency: alpha_channel
    resize: 160x54
  - platform: file
    file: "assets/fan.svg"
    id: theme_fan_art
    type: RGB565
    transparency: alpha_channel
    resize: 96x96
  - platform: file
    file: "assets/echo.svg"
    id: theme_echo_art
    type: RGB565
    transparency: alpha_channel
    resize: 54x54
