name: Build theme PNG assets

on:
  push:
    branches: [main]
    paths:
      - "tools/build_theme_png_assets.py"
      - "tools/build_reference_theme_extras.py"
      - ".github/workflows/build-theme-png-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-theme-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate high-resolution transparent PNG source assets
        run: |
          python tools/build_theme_png_assets.py
          python tools/build_reference_theme_extras.py
      - name: Validate PNG to LVGL ARGB packing
        run: python tools/generate_theme_art.py
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/theme-sprites/*.png
          if git diff --cached --quiet; then
            echo "Theme PNG assets are already current."
          else
            git commit -m "Add high-resolution theme PNG sprite assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
