name: Validate theme artwork and displays

on:
  push:
    branches: [main]
    paths: ['assets/**', 'main/**', 'tools/**', 'tests/host/**', '.github/workflows/build-theme-png-assets.yml']
  pull_request:
    paths: ['assets/**', 'main/**', 'tools/**', 'tests/host/**', '.github/workflows/build-theme-png-assets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit committed artwork and pack LVGL sprites
        run: python tools/check_theme_assets.py
      - name: Fetch the firmware's LVGL version
        run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Build production UI against LVGL
        run: |
          cmake -S tests/host -B build/host -DLVGL_DIR="$RUNNER_TEMP/lvgl" -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host --parallel 4
      - name: Render themes and verify control/state behavior
        run: |
          mkdir -p build/previews
          for theme in 0 1 2 3; do
            build/host/panel_render "$theme" "build/previews/theme-$theme.ppm"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lvgl-theme-previews
          path: build/previews/*.ppm
