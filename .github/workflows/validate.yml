name: Validate ESPHome panels

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel:
          - panels/classic-dark/panel.yaml
          - panels/soccer-green/panel.yaml
          - panels/kittens-pink/panel.yaml
          - panels/magic-bricks-blue/panel.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install 'esphome==2026.8.2'

      - name: Create CI-only secrets
        shell: bash
        run: |
          panel_dir="$(dirname '${{ matrix.panel }}')"
          cat > "${panel_dir}/secrets.yaml" <<'EOF'
          wifi_ssid: "CI_WIFI"
          wifi_password: "ci-password"
          fallback_ap_password: "ci-fallback-password"
          api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "ci-ota-password"
          EOF

      - name: Validate configuration
        run: esphome config '${{ matrix.panel }}'
