name: Build ESP-IDF firmware

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: esp-idf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Waveshare 7C BOX firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: idf
