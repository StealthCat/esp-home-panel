name: Build ESP-IDF firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Waveshare 7C BOX firmware
        shell: bash
        run: |
          cd idf
          idf.py set-target esp32s3
          idf.py build
