name: Build ESP-IDF firmware

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: esp-idf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp-idf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with ESP-IDF 5.5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: idf

  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build with PlatformIO
        working-directory: idf
        run: pio run
