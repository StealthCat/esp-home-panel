name: Build panel firmware and test OTA

on:
  push:
    branches: [main, weather]
    paths: ['main/**', 'home-assistant/**', 'tools/**', 'assets/**', 'boards/**', 'CMakeLists.txt', 'platformio.ini', 'partitions.csv', 'sdkconfig.defaults', '.github/workflows/build-firmware.yml']
  pull_request:
    paths: ['main/**', 'home-assistant/**', 'tools/**', 'assets/**', 'boards/**', 'CMakeLists.txt', 'platformio.ini', 'partitions.csv', 'sdkconfig.defaults', '.github/workflows/build-firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: esp32s3-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'main/idf_component.yml') }}
      - name: Install build tools
        run: pip install platformio==6.1.18 pillow pyyaml jinja2
      - name: Test settings, network identity and OTA failure handling
        run: |
          python tools/test_display_policy.py
          python tools/test_weather.py
          python tools/test_c4001.py
          python tools/test_presence_mqtt.py
          python tools/test_light_commands.py
          python tools/test_sensors.py
          python tools/test_color_settings.py
          python tools/test_network_identity.py
          python tools/test_ota.py
          python tools/test_component_cmake.py
          node tools/test_firmware_ui.js
      - name: Build ESP32-S3 firmware
        run: pio run -e waveshare-7c-box
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: esp-home-panel-ota-${{ github.sha }}
          path: .pio/build/waveshare-7c-box/firmware.bin
          if-no-files-found: error

  settings-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium --only-shell
      - name: Check desktop and mobile settings
        run: node tools/test_settings_ui.js
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: settings-ui-previews
          path: /tmp/panel-settings-check/*.png
